<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>孤岛臭臭鼠快跑</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07191d;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{position:fixed;inset:0}
#game{position:fixed;inset:0;overflow:hidden;background:#69c4d2}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;z-index:20;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:7px;pointer-events:none}
.hudBox{color:white;font-size:13px;font-weight:800;padding:8px 11px;border-radius:20px;background:rgba(4,25,30,.45);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);text-shadow:0 2px 3px rgba(0,0,0,.4);white-space:nowrap}
#tip{position:absolute;z-index:21;left:50%;bottom:calc(env(safe-area-inset-bottom) + 15px);transform:translateX(-50%);padding:8px 14px;border-radius:30px;color:white;background:rgba(0,0,0,.28);font-size:13px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
#menu{position:absolute;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,18,21,.25);backdrop-filter:blur(3px)}
.panel{width:min(90vw,390px);padding:30px 23px 25px;text-align:center;color:white;border-radius:30px;background:linear-gradient(145deg,rgba(7,37,42,.94),rgba(5,21,25,.91));border:1px solid rgba(255,255,255,.16);box-shadow:0 25px 80px rgba(0,0,0,.45)}
.logo{font-size:62px;margin-bottom:5px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
h1{margin:0 0 10px;font-size:31px;letter-spacing:1px}
.description{margin:0 0 22px;color:rgba(255,255,255,.76);font-size:14px;line-height:1.8}
button{border:0;padding:14px 43px;border-radius:50px;color:#263528;background:linear-gradient(#ffed96,#ffd45a);font-size:18px;font-weight:900;box-shadow:0 5px 0 #b38e32,0 12px 30px rgba(255,210,70,.2)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b38e32}
.small{margin-top:15px;color:rgba(255,255,255,.45);font-size:12px}
#gameOver{display:none}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
<div class="hudBox">🏝️ 臭臭鼠</div>
<div class="hudBox">📏 <span id="distance">0</span>m</div>
<div class="hudBox">🏆 <span id="best">0</span>m</div>
</div>

<div id="tip">← → 移动　↑ 跳跃</div>

<div id="menu">

<div class="panel" id="startPanel">
<div class="logo">🐭</div>

<h1>孤岛臭臭鼠快跑</h1>

<p class="description">
一座没有尽头的神秘孤岛。<br>
控制臭臭鼠一路向前奔跑。<br>
跑得越远，速度越快！
</p>

<button id="startButton">开始奔跑</button>

<div class="small">
左右滑动移动 · 上滑跳跃
</div>

</div>

<div class="panel" id="gameOver">

<div class="logo">🌊🐭</div>

<h1>臭臭鼠落水了</h1>

<p class="description">
本次距离：<b id="finalDistance">0</b>m<br>
最高纪录：<b id="finalBest">0</b>m
</p>

<button id="restartButton">再跑一次</button>

<div class="small">
挑战你的最高纪录
</div>

</div>

</div>

</div>

<script>

"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=0,H=0,DPR=1;

function resize(){

DPR=Math.min(window.devicePixelRatio||1,2);

W=window.innerWidth;
H=window.innerHeight;

canvas.width=W*DPR;
canvas.height=H*DPR;

canvas.style.width=W+"px";
canvas.style.height=H+"px";

ctx.setTransform(DPR,0,0,DPR,0,0);

}

window.addEventListener("resize",resize);

resize();

let running=false;
let lastTime=0;
let worldTime=0;
let distance=0;
let speed=1;
let spawnTimer=0;

let lane=1;

let jumpY=0;
let jumpVelocity=0;

let objects=[];
let particles=[];

let cameraShake=0;

let best=Number(localStorage.getItem("chouchoushu_best")||0);

document.getElementById("best").textContent=best;

const laneOffset=[-.31,0,.31];

function getRoadPosition(l,y){

const horizon=H*.36;
const bottom=H*1.08;

let p=(y-horizon)/(bottom-horizon);

p=Math.max(0,Math.min(1,p));

return W/2+laneOffset[l]*W*(.25+p*.95);

}

function getRoadEdges(y){

const horizon=H*.36;
const bottom=H*1.08;

let p=(y-horizon)/(bottom-horizon);

p=Math.max(0,Math.min(1,p));

const half=W*(.08+.44*p);

return [W/2-half,W/2+half];

}

function random(a,b){

return a+Math.random()*(b-a);

}

function spawn(type,l){

objects.push({

type:type,
lane:l,
y:H*.32,
rotation:random(-.12,.12),
phase:Math.random()*10,
hit:false

});

}

function spawnWave(){

const r=Math.random();

if(r<.18){

spawn("coin",Math.floor(Math.random()*3));

return;

}

if(r<.55){

const l=Math.floor(Math.random()*3);

const types=["rock","log","palm"];

spawn(types[Math.floor(Math.random()*types.length)],l);

return;

}

if(r<.82){

const safe=Math.floor(Math.random()*3);

for(let i=0;i<3;i++){

if(i!==safe){

spawn("rock",i);

}

}

return;

}

const route=Math.floor(Math.random()*3);

spawn("coin",route);

setTimeout(()=>{

if(running){

spawn("coin",route);

}

},170);

}

function createParticles(x,y,color){

for(let i=0;i<12;i++){

particles.push({

x:x,
y:y,
vx:random(-3,3),
vy:random(-4,1),
life:1,
color:color

});

}

}

function drawSky(){

const g=ctx.createLinearGradient(0,0,0,H*.6);

g.addColorStop(0,"#4fb5ce");
g.addColorStop(.65,"#a9ded7");
g.addColorStop(1,"#d7e4cf");

ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);

ctx.beginPath();

ctx.arc(
W*.78,
H*.14,
Math.min(W,H)*.055,
0,
Math.PI*2
);

ctx.fillStyle="rgba(255,240,175,.9)";
ctx.fill();

ctx.fillStyle="#477b73";

ctx.beginPath();

ctx.moveTo(0,H*.40);

ctx.quadraticCurveTo(
W*.15,H*.28,
W*.30,H*.40
);

ctx.quadraticCurveTo(
W*.48,H*.27,
W*.67,H*.40
);

ctx.quadraticCurveTo(
W*.84,H*.30,
W,H*.39
);

ctx.lineTo(W,H*.50);
ctx.lineTo(0,H*.50);

ctx.fill();

}

function drawSea(){

ctx.fillStyle="#0d7181";

ctx.fillRect(
0,
H*.39,
W,
H*.61
);

for(let i=0;i<22;i++){

const y=
H*.43+
i*H*.032+
(worldTime*.05%(H*.032));

ctx.strokeStyle="rgba(220,255,250,.14)";
ctx.lineWidth=2;

ctx.beginPath();

for(let x=-50;x<W+50;x+=65){

ctx.moveTo(x,y);

ctx.quadraticCurveTo(
x+16,
y-4,
x+32,
y
);

}

ctx.stroke();

}

}

function drawIsland(){

ctx.fillStyle="#315f3d";

ctx.beginPath();

ctx.moveTo(0,H*.50);

ctx.quadraticCurveTo(
W*.18,H*.39,
W*.37,H*.44
);

ctx.quadraticCurveTo(
W*.50,H*.37,
W*.64,H*.44
);

ctx.quadraticCurveTo(
W*.83,H*.39,
W,H*.49
);

ctx.lineTo(W,H);
ctx.lineTo(0,H);

ctx.fill();

const top=H*.36;
const bottom=H*1.08;

ctx.beginPath();

ctx.moveTo(W*.44,top);
ctx.lineTo(W*.56,top);
ctx.lineTo(W*.94,bottom);
ctx.lineTo(W*.06,bottom);

ctx.closePath();

const g=ctx.createLinearGradient(
0,
top,
0,
bottom
);

g.addColorStop(0,"#806044");
g.addColorStop(.45,"#a77a4c");
g.addColorStop(1,"#c09459");

ctx.fillStyle=g;
ctx.fill();

ctx.strokeStyle="#668b45";

ctx.lineWidth=Math.max(8,W*.018);

ctx.beginPath();

ctx.moveTo(W*.44,top);
ctx.lineTo(W*.06,bottom);

ctx.moveTo(W*.56,top);
ctx.lineTo(W*.94,bottom);

ctx.stroke();

for(let i=0;i<15;i++){

let p=(i/15+worldTime/1000)%1;

let y=top+p*(bottom-top);

let e=getRoadEdges(y);

ctx.strokeStyle="rgba(255,225,160,.20)";
ctx.lineWidth=4;

ctx.beginPath();

ctx.moveTo(e[0],y);
ctx.lineTo(e[1],y);

ctx.stroke();

}

for(let i=0;i<12;i++){

const x=(i*91+43)%W;
const y=H*(.52+(i%5)*.09);

ctx.font="25px sans-serif";

ctx.fillText(
i%2===0?"🌿":"🪨",
x,
y
);

}

}

function drawObject(o){

const y=o.y;

const x=getRoadPosition(o.lane,y);

const p=Math.max(
.25,
Math.min(
1,
(y-H*.36)/(H*.72)
)
);

const scale=.25+.95*p;

ctx.save();

ctx.translate(x,y);
ctx.scale(scale,scale);
ctx.rotate(o.rotation);

if(o.type==="coin"){

ctx.shadowBlur=18;
ctx.shadowColor="#ffd52e";

ctx.fillStyle="#ffd83f";

ctx.beginPath();

ctx.arc(0,0,15,0,Math.PI*2);

ctx.fill();

ctx.shadowBlur=0;

ctx.strokeStyle="#c9951c";
ctx.lineWidth=4;

ctx.stroke();

ctx.fillStyle="#fff0a0";

ctx.fillRect(-2,-9,4,18);

}

else if(o.type==="rock"){

ctx.fillStyle="#59635c";

ctx.beginPath();

ctx.moveTo(-23,18);
ctx.lineTo(-18,-8);
ctx.lineTo(-4,-22);
ctx.lineTo(17,-13);
ctx.lineTo(24,15);

ctx.closePath();

ctx.fill();

ctx.fillStyle="#7a8279";

ctx.beginPath();

ctx.moveTo(-13,-8);
ctx.lineTo(-3,-18);
ctx.lineTo(8,-11);
ctx.lineTo(0,1);

ctx.closePath();

ctx.fill();

}

else if(o.type==="log"){

ctx.fillStyle="#70472f";

ctx.fillRect(
-26,
-11,
52,
22
);

ctx.fillStyle="#a66c45";

ctx.fillRect(
-20,
-7,
40,
6
);

}

else if(o.type==="palm"){

ctx.fillStyle="#76543a";

ctx.fillRect(
-5,
-5,
10,
44
);

ctx.fillStyle="#286d3c";

for(let a=-2.8;a<-.1;a+=.62){

ctx.save();

ctx.rotate(a);

ctx.beginPath();

ctx.ellipse(
0,
-31,
9,
29,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}

}

ctx.restore();

}

function drawMouse(){

const baseY=H*.76;

const x=getRoadPosition(lane,baseY);

const y=
baseY-
jumpY+
Math.sin(worldTime*.018)*3;

ctx.save();

ctx.translate(x,y);

ctx.strokeStyle="#825b48";
ctx.lineWidth=5;

ctx.beginPath();

ctx.arc(
24,
5,
25,
.1,
4.7
);

ctx.stroke();

ctx.fillStyle="#98715a";

ctx.beginPath();

ctx.ellipse(
0,
0,
25,
30,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#b98d72";

ctx.beginPath();

ctx.arc(-18,-25,13,0,Math.PI*2);
ctx.arc(18,-25,13,0,Math.PI*2);

ctx.fill();

ctx.fillStyle="#754e42";

ctx.beginPath();

ctx.arc(-18,-25,7,0,Math.PI*2);
ctx.arc(18,-25,7,0,Math.PI*2);

ctx.fill();

ctx.fillStyle="#111";

ctx.beginPath();

ctx.arc(-9,-5,3.3,0,Math.PI*2);
ctx.arc(9,-5,3.3,0,Math.PI*2);

ctx.fill();

ctx.fillStyle="#3b2520";

ctx.beginPath();

ctx.arc(
0,
6,
5,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#c79a76";

ctx.beginPath();

ctx.ellipse(
0,
10,
14,
15,
0,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#785645";

ctx.fillRect(-17,20,10,9);
ctx.fillRect(7,20,10,9);

ctx.restore();

}

function drawParticles(){

for(const p of particles){

ctx.globalAlpha=p.life;

ctx.fillStyle=p.color;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
3,
0,
Math.PI*2
);

ctx.fill();

}

ctx.globalAlpha=1;

}

function checkCollision(o){

if(o.hit)return;

const playerY=H*.76-jumpY;

if(
o.y>playerY-50&&
o.y<playerY+35&&
o.lane===lane
){

if(
jumpY>55&&
o.type!=="coin"
)return;

o.hit=true;

if(o.type==="coin"){

distance+=10;

createParticles(
getRoadPosition(o.lane,o.y),
o.y,
"#ffe36a"
);

o.y=H*2;

return;

}

createParticles(
getRoadPosition(o.lane,o.y),
o.y,
"#ffffff"
);

gameOver();

}

}

function gameOver(){

if(!running)return;

running=false;

const result=Math.floor(distance);

if(result>best){

best=result;

localStorage.setItem(
"chouchoushu_best",
best
);

}

document.getElementById("distance").textContent=result;
document.getElementById("best").textContent=best;
document.getElementById("finalDistance").textContent=result;
document.getElementById("finalBest").textContent=best;

document.getElementById("startPanel").style.display="none";
document.getElementById("gameOver").style.display="block";
document.getElementById("menu").style.display="flex";

}

function startGame(){

running=true;

distance=0;
speed=1;
spawnTimer=0;
worldTime=0;

lane=1;

jumpY=0;
jumpVelocity=0;

objects=[];
particles=[];

document.getElementById("distance").textContent="0";

document.getElementById("menu").style.display="none";

lastTime=performance.now();

requestAnimationFrame(gameLoop);

}

function jump(){

if(!running)return;

if(jumpY>2)return;

jumpVelocity=14;

}

function gameLoop(time){

if(!running){

draw();

return;

}

const dt=Math.min(
34,
time-lastTime
);

lastTime=time;

worldTime+=dt;

speed=
1+
Math.min(
2.8,
distance/230
);

distance+=
dt*
.018*
speed;

if(
jumpY>0||
jumpVelocity>0
){

jumpY+=
jumpVelocity*
dt*
.08;

jumpVelocity-=
.75*
dt*
.08;

if(jumpY<=0){

jumpY=0;
jumpVelocity=0;

}

}

spawnTimer+=dt;

const spawnInterval=
Math.max(
310,
720-distance*1.15
);

if(spawnTimer>spawnInterval){

spawnWave();

spawnTimer=0;

}

for(const o of objects){

o.y+=
dt*
H*
.00043*
speed*
(.9+o.y/H*.6);

o.phase+=dt*.002;

checkCollision(o);

}

objects=
objects.filter(
o=>o.y<H*1.25
);

for(const p of particles){

p.x+=
p.vx*
dt*
.06;

p.y+=
p.vy*
dt*
.06;

p.vy+=.12;

p.life-=
dt*
.003;

}

particles=
particles.filter(
p=>p.life>0
);

document.getElementById("distance").textContent=
Math.floor(distance);

draw();

requestAnimationFrame(gameLoop);

}

let touchStartX=0;
let touchStartY=0;

document.addEventListener(
"touchstart",
e=>{

if(!e.touches.length)return;

touchStartX=
e.touches[0].clientX;

touchStartY=
e.touches[0].clientY;

},
{passive:false}
);

document.addEventListener(
"touchend",
e=>{

if(
!running||
!e.changedTouches.length
)return;

const endX=
e.changedTouches[0].clientX;

const endY=
e.changedTouches[0].clientY;

const dx=
endX-touchStartX;

const dy=
endY-touchStartY;

if(
Math.abs(dx)>
Math.abs(dy)
){

if(Math.abs(dx)>25){

lane=
dx>0?
Math.min(2,lane+1):
Math.max(0,lane-1);

}

}
else{

if(dy<-30){

jump();

}

}

e.preventDefault();

},
{passive:false}
);

document.addEventListener(
"keydown",
e=>{

if(!running)return;

if(e.key==="ArrowLeft")
lane=Math.max(0,lane-1);

if(e.key==="ArrowRight")
lane=Math.min(2,lane+1);

if(
e.key==="ArrowUp"||
e.key===" "
)
jump();

}
);

document.getElementById(
"startButton"
).addEventListener(
"click",
startGame
);

document.getElementById(
"restartButton"
).addEventListener(
"click",
startGame
);

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

document.addEventListener(
"gesturestart",
e=>e.preventDefault()
);

document.addEventListener(
"touchmove",
e=>e.preventDefault(),
{passive:false}
);

function draw(){

ctx.save();

drawSky();
drawSea();
drawIsland();

objects
.sort((a,b)=>a.y-b.y)
.forEach(drawObject);

drawMouse();
drawParticles();

ctx.restore();

}

draw();

</script>

</body>
</html>
